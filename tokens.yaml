---
# Source of truth for the club visual identity.
# css/tokens.css is generated from this file: run scripts/build_tokens.py after any change.

colors:
  # Brand blues
  accent: "#3f60aa"        # light blue: highlights, links, focus, buttons
  accent-light: "#8fa6dc"  # current item marker on a dark blue band
  blue: "#1b2b5a"          # dark blue: header bands, table headers, strong elements
  blue-mid: "#475b8b"
  ink: "#09132d"           # main text
  header-text: "#ccd4ea"   # secondary text on a dark blue band

  # Surfaces
  bg: "#f3ebe7"            # off-white page background
  card: "#fffdfb"          # cards, tables, inputs
  pale: "#eef1f8"          # light highlight (hovered tile)
  hover: "#e8edf7"         # hovered table row
  highlight: "#fff4d1"     # remarkable row (record, title)

  # Neutrals
  gray: "#3b3f50"          # secondary text
  gray-soft: "#767e98"     # non-text elements only (insufficient contrast for body text)
  border: "#acafc1"        # borders and rules

  # Status
  danger: "#c00"
  success: "#1a7a3e"
  warning: "#a15c00"

  # Medals and podiums
  gold: "#c99a06"
  silver: "#8d99a3"
  bronze: "#a8602d"

typography:
  font-body: 'system-ui, -apple-system, "Segoe UI", "Roboto", sans-serif'
  font-script: '"Caveat", "Segoe Script", "Bradley Hand", cursive'
  font-mono: "ui-monospace, monospace"
  # Embedded font for generated PDFs: identical rendering on every build machine
  font-print: '"Inter", "Segoe UI", "Roboto", sans-serif'
  font-size-base: "16px"
  line-height: "1.55"
  heading-letter-spacing: "0.03em"

sizes:
  radius: "6px"
  radius-sm: "4px"
  accent-border-width: "4px"  # left/bottom accent border on cards and header
  layout-width: "1240px"
  layout-width-narrow: "720px"  # forms, single-column pages
  logo-height: "64px"
  logo-height-mobile: "44px"
